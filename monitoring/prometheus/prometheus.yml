global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: orders-api
    static_configs:
      - targets: ["orders-api:8000"]
        labels: { service: orders-api }

  - job_name: inventory-service
    static_configs:
      - targets: ["inventory-service:8000"]
        labels: { service: inventory-service }

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels: { service: target-postgres }

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels: { service: redis }

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
