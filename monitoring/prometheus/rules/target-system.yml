# for_duration mirrors `for:` because the webhook payload does not carry it.
# The agent reads it to place the evidence window before startsAt.
# Keep the two in sync.
#
# Thresholds: healthy p95 is ~105ms on DB routes (100ms client-side hold) and
# single-digit ms on cached reads. Re-check against the measured baseline
# recorded in docs/02-local-setup.md.

groups:
  - name: target-system
    rules:
      - alert: HighLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum by (service, method, route, le) (rate(http_request_duration_seconds_bucket[1m]))
          ) > 0.5
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "p95 latency above 500ms on {{ $labels.service }} {{ $labels.method }} {{ $labels.route }}"
          for_duration: "2m"

      - alert: HighErrorRate
        expr: |
          sum by (service, method, route) (rate(http_requests_total{status=~"5.."}[1m]))
            /
          sum by (service, method, route) (rate(http_requests_total[1m]))
          > 0.05
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "5xx rate above 5% on {{ $labels.service }} {{ $labels.method }} {{ $labels.route }}"
          for_duration: "2m"
